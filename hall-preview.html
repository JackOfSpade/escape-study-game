<!doctype html>
<html><head><meta charset="UTF-8" /><title>drawn preview</title>
<style>html,body{margin:0;background:#000}canvas{width:100vw;height:100vh;display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { FirstPersonView } from "/src/view3d/scene.ts";
import { structureGame } from "/src/world.ts";
import { parseRunStructure } from "/src/run-design-contract.mjs";
const roadmap = await (await fetch("/curriculum.json")).json();
const design = await (await fetch("/tests/fixtures/run-designs/planetarium-drawn.json")).json();
const q = new URLSearchParams(location.search);
if (q.get("storeys")) design.floors = design.floors.slice(0, +q.get("storeys"));
const g = structureGame(42, roadmap, undefined, parseRunStructure(design));
const a = g.survivors[0];
a.x = +(q.get("x") ?? 20.5); a.y = +(q.get("y") ?? 22.5); a.floor = +(q.get("floor") ?? 0);
if (q.get("feet")) a.elevated = { feet: +q.get("feet"), vx: 0, vy: 0, vz: 0, peak: +q.get("feet"), grounded: true };
const view = new FirstPersonView(document.getElementById("c"));
window.game = g; window.view = view;
const yaw = +(q.get("yaw") ?? Math.PI), pitch = +(q.get("pitch") ?? -0.1);
function frame() { view.render(g, yaw, pitch, 1 / 60); requestAnimationFrame(frame); }
frame();
</script></body></html>
